spring:
  application:
    name: nexusflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/nexusflow
    username: nexusflow
    password: nexusflow

  jpa:
    hibernate:
      # 'validate': Hibernate NUNCA modifica el esquema, solo comprueba que
      # las entidades @Entity coinciden con las tablas reales creadas por
      # Flyway. Si no coinciden, el arranque falla con un error claro.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
